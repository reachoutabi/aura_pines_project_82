<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winter Snow Season Launching Soon | AURA PINES</title>
  <meta name="description" content="Aura Pines winter wonderland season is opening soon. Heated starlit domes, alpine snowshoeing, and Nordic fireside dining.">

  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .coming-soon-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 3rem 1.5rem;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      text-align: center;
    }
    .coming-soon-wrapper h1,
    .coming-soon-wrapper h2,
    .coming-soon-wrapper strong {
      color: #FFFFFF !important;
    }
    .coming-soon-wrapper p {
      color: #E8E2D5 !important;
    }
    .coming-soon-wrapper .text-muted {
      color: #B5C3B0 !important;
    }
    .cs-countdown-units {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }
    .cs-box {
      background: rgba(18, 34, 27, 0.85);
      border: 1px solid var(--accent-primary);
      min-width: 80px;
      padding: 1rem;
      border-radius: var(--radius-md);
      text-align: center;
    }
    .cs-box .cs-val {
      font-family: var(--font-serif);
      font-size: 2.25rem;
      font-weight: 700;
      color: var(--accent-primary);
      line-height: 1;
    }
    .cs-box .cs-unit {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    @media (max-width: 576px) {
      .coming-soon-wrapper {
        padding: 2rem 1rem;
      }
      .cs-countdown-units {
        gap: 0.5rem;
      }
      .cs-box {
        min-width: 62px;
        padding: 0.65rem 0.4rem;
      }
      .cs-box .cs-val {
        font-size: 1.5rem;
      }
    }
    @media (max-width: 360px) {
      .cs-countdown-units {
        gap: 0.35rem;
      }
      .cs-box {
        min-width: 56px;
        padding: 0.5rem 0.25rem;
      }
      .cs-box .cs-val {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

  <div class="coming-soon-wrapper">
    <div class="hero-bg-animated hero-bg-pan" style="background-image: url('https://images.unsplash.com/photo-1510312305653-8ed496efae75?auto=format&fit=crop&w=2000&q=85');"></div>
    <div class="hero-overlay"></div>
    <!-- Header Logo & Quick Actions -->
    <div class="w-100 d-flex justify-content-between align-items-center" style="max-width: 900px;">
      <a href="index.html" class="brand-logo" style="color: #FFF;">
        <div class="brand-icon"><i class="bi bi-fire"></i></div>
        <span>AURA PINES</span>
      </a>
      <div class="d-flex gap-2">
        <button class="icon-btn-toggle rtl-toggle-btn" title="Toggle RTL layout" aria-label="Toggle text direction" style="width: 36px; height: 36px; background: rgba(18, 34, 27, 0.7); border-color: rgba(255,255,255,0.2); color: #FFF;">
          <i class="bi bi-arrow-left-right"></i>
        </button>
        <button class="icon-btn-toggle theme-toggle-btn" title="Toggle light/dark theme" aria-label="Toggle light or dark theme" style="width: 36px; height: 36px; background: rgba(18, 34, 27, 0.7); border-color: rgba(255,255,255,0.2); color: #FFF;">
          <i class="bi bi-moon-stars-fill"></i>
        </button>
      </div>
    </div>

    <!-- Center Content -->
    <div style="max-width: 680px; margin-block: 2rem;">
      <span class="section-badge mb-3"><i class="bi bi-snow"></i> Winter Glacier Season</span>
      <h1 style="font-family: var(--font-serif); font-size: clamp(2.5rem, 5.5vw, 4rem); color: #FFF; margin-bottom: 1.25rem;">
        The Winter Season Opens Soon
      </h1>
      <p style="color: var(--text-secondary); font-size: 1.15rem; line-height: 1.7; margin-bottom: 2.5rem;">
        We are completing insulated thermal geodesic domes, heated cedar soak tubs, and preparing 28 miles of untouched snowshoe trails.
      </p>

      <!-- Live Launch Countdown -->
      <div class="cs-countdown-units">
        <div class="cs-box">
          <div class="cs-val" id="csDays">24</div>
          <div class="cs-unit">Days</div>
        </div>
        <div class="cs-box">
          <div class="cs-val" id="csHours">14</div>
          <div class="cs-unit">Hours</div>
        </div>
        <div class="cs-box">
          <div class="cs-val" id="csMins">48</div>
          <div class="cs-unit">Mins</div>
        </div>
        <div class="cs-box">
          <div class="cs-val" id="csSecs">12</div>
          <div class="cs-unit">Secs</div>
        </div>
      </div>

      <!-- Email Notification Form -->
      <div style="max-width: 480px; margin: 0 auto;">
        <form class="newsletter-form">
          <div class="d-flex gap-2">
            <input type="email" placeholder="Enter your email for VIP early access..." class="search-field-input" required>
            <button type="submit" class="btn-camp btn-camp-primary btn-sm" style="flex-shrink: 0;">Notify Me</button>
          </div>
        </form>
        <div class="mt-3">
          <a href="index.html" class="btn-camp btn-camp-ghost btn-sm" style="color: var(--text-secondary);">
            <i class="bi bi-arrow-left"></i> Return to Main Website
          </a>
        </div>
      </div>
    </div>

    <!-- Bottom Socials -->
    <div class="d-flex gap-3">
      <a href="https://www.instagram.com" target="_blank" rel="noopener noreferrer" class="icon-btn-toggle" aria-label="Instagram" title="Follow us on Instagram"><i class="bi bi-instagram"></i></a>
      <a href="https://www.facebook.com" target="_blank" rel="noopener noreferrer" class="icon-btn-toggle" aria-label="Facebook" title="Follow us on Facebook"><i class="bi bi-facebook"></i></a>
      <a href="https://x.com" target="_blank" rel="noopener noreferrer" class="icon-btn-toggle" aria-label="Twitter X" title="Follow us on X (Twitter)"><i class="bi bi-twitter-x"></i></a>
      <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" class="icon-btn-toggle" aria-label="YouTube" title="Watch on YouTube"><i class="bi bi-youtube"></i></a>
      <a href="https://www.tripadvisor.com" target="_blank" rel="noopener noreferrer" class="icon-btn-toggle" aria-label="TripAdvisor" title="Find us on TripAdvisor"><i class="bi bi-compass"></i></a>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="assets/js/images-config.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    // Live countdown timer for launch
    let secondsLeft = 24 * 86400 + 14 * 3600 + 48 * 60 + 12;
    setInterval(() => {
      if (secondsLeft <= 0) return;
      secondsLeft--;
      const d = Math.floor(secondsLeft / 86400);
      const h = Math.floor((secondsLeft % 86400) / 3600);
      const m = Math.floor((secondsLeft % 3600) / 60);
      const s = secondsLeft % 60;
      document.getElementById('csDays').textContent = String(d).padStart(2, '0');
      document.getElementById('csHours').textContent = String(h).padStart(2, '0');
      document.getElementById('csMins').textContent = String(m).padStart(2, '0');
      document.getElementById('csSecs').textContent = String(s).padStart(2, '0');
    }, 1000);
  </script>
</body>
</html>
